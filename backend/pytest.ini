[pytest]
# CI 的 console_script 入口不会把 cwd 放进 sys.path（python -m 才会），
# 而测试文件全部 `from app...` 导入 —— 显式把 backend/ 根写进 import 路径，
# 保证本地 / CI / 任何机器行为一致。
pythonpath = .
# 在 backend/ 目录下直接执行 `pytest` 即可，无需手写 tests/ 路径。
testpaths = tests

# 用例类命名约定是 *Tests。pytest 默认只收 Test*，而 unittest.TestCase 子类虽不受
# 该限制、**普通类却受** —— 于是同一命名约定下，继承 TestCase 的被收集、不继承的
# 静默收集 0 条。test_limitup_snapshot_store.py 就这么漏了整整一个文件（含本次新增的
# 快照清理用例）。显式声明是为了让两种写法都能被跑到，不再靠「有没有继承」决定生死。
python_classes = Test* *Tests

# 异步用例统一用显式 @pytest.mark.asyncio 标注（strict）。
# 不用 auto：auto 会把所有 async 函数当测试收集，容易把工具函数误判成用例。
asyncio_mode = strict

# 每个用例一个独立 event loop（与 app/services/concurrency.py 里「按 loop 缓存信号量」相配套）。
asyncio_default_fixture_loop_scope = function
